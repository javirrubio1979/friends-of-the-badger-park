<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Friends of the Badger Park</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-filter {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      justify-content: center; margin-bottom: 2.5rem;
    }
    .gallery-filter button {
      padding: 0.45rem 1.1rem; border-radius: 50px;
      border: 2px solid #ddd; background: var(--white);
      font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: 0.85rem;
      cursor: pointer; transition: all var(--transition);
    }
    .gallery-filter button:hover,
    .gallery-filter button.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .masonry-grid {
      columns: 3; column-gap: 1.25rem;
    }
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .gallery-item:hover { transform: scale(1.02); box-shadow: var(--shadow-lg); }
    .gallery-item:hover .gallery-overlay { opacity: 1; }

    /* Placeholder coloured image tiles */
    .gallery-img { width:100%; overflow:hidden; background:var(--green-light); }
    .gallery-img img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-item { display:block; width:100%; padding:0; border:0; text-align:left; background:#fff; }
    .gallery-caption { display:block; padding:.65rem .8rem; color:var(--text); font-weight:800; font-size:.85rem; }
    .gallery-item[hidden] { display:none; }
    .gallery-img.h-sm  { height: 180px; }
    .gallery-img.h-md  { height: 240px; }
    .gallery-img.h-lg  { height: 310px; }
    .gallery-img.c-blue   { background: var(--blue-light); }
    .gallery-img.c-amber  { background: #FFF3D6; }
    .gallery-img.c-parch  { background: var(--parchment); }

    .gallery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(14,61,128,0.85) 0%, transparent 60%);
      opacity: 0; transition: opacity var(--transition);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 1rem;
    }
    .gallery-overlay span { color: #fff; font-weight: 700; font-size: 0.88rem; }
    .gallery-overlay small { color: rgba(255,255,255,0.7); font-size: 0.76rem; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }
    .lightbox-inner {
      background: var(--white); border-radius: 16px;
      max-width: 600px; width: 90%; overflow: hidden;
      transform: scale(0.9); transition: transform 0.3s;
    }
    .lightbox.open .lightbox-inner { transform: scale(1); }
    .lightbox-img {
      width: 100%; max-height:70vh; object-fit:contain; display:block; background:#15251a;
    }
    .lightbox-nav { position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border:1px solid rgba(255,255,255,.65); border-radius:50%; background:rgba(0,0,0,.42); color:#fff; font-size:2rem; line-height:1; cursor:pointer; z-index:2; }
    .lightbox-nav:hover { background:rgba(0,0,0,.72); }
    .lightbox-prev { left:clamp(12px,4vw,56px); }
    .lightbox-next { right:clamp(12px,4vw,56px); }
    .lightbox-body { padding: 1.5rem; }
    @media(max-width:600px){.lightbox-inner{width:calc(100% - 76px)}.lightbox-nav{width:40px;height:40px;font-size:1.65rem}.lightbox-prev{left:8px}.lightbox-next{right:8px}}
    .lightbox-body h3 { margin-bottom: 0.4rem; color: var(--blue-dark); }
    .lightbox-body p  { color: var(--text-muted); font-size: 0.9rem; margin: 0; }
    .lightbox-close {
      position: absolute; top: 1rem; right: 1rem;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.2); border: none;
      color: #fff; font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.35); }

    .upload-cta {
      text-align: center; background: var(--parchment);
      border-radius: var(--radius); padding: 2.5rem;
      border: 2px dashed #ccc; margin-top: 2rem;
    }

    @media(max-width:900px){ .masonry-grid { columns: 2; } }
    @media(max-width:520px){ .masonry-grid { columns: 1; } }
  </style>
</head>
<body>

<section class="page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="index.html">Home</a> / Gallery</p>
    <h1>Photo Gallery</h1>
    <p>One selected photo for each event with archive images, ordered from newest to oldest.</p>
  </div>
</section>

<section class="section">
  <div class="container">

<div class="gallery-filter" role="group" aria-label="Filter gallery photos"><button class="active" data-filter="all" type="button">All photos</button><button data-filter="colour-run" type="button">Colour Runs</button><button data-filter="nature" type="button">Nature &amp; planting</button><button data-filter="community" type="button">Community events</button></div>
    <div class="masonry-grid">
<button class="gallery-item fade-up" data-category="colour-run" type="button" aria-label="View Colour Run, July 2026"><div class="gallery-img h-sm"><img src="images/deploy/2026-colour-run-15.webp" alt="Colour Run, July 2026" loading="lazy"></div><span class="gallery-caption">Colour Run, July 2026</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Family Walk, May 2026"><div class="gallery-img h-md"><img src="images/deploy/2026-family-walk-03.webp" alt="Family Walk, May 2026" loading="lazy"></div><span class="gallery-caption">Family Walk, May 2026</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Christmas Carols, December 2025"><div class="gallery-img h-lg"><img src="images/deploy/2025-christmas-carols-02.webp" alt="Christmas Carols, December 2025" loading="lazy"></div><span class="gallery-caption">Christmas Carols, December 2025</span></button>
<button class="gallery-item fade-up" data-category="colour-run" type="button" aria-label="View Colour Run, August 2025"><div class="gallery-img h-sm"><img src="images/deploy/2025-colour-run-07.webp" alt="Colour Run, August 2025" loading="lazy"></div><span class="gallery-caption">Colour Run, August 2025</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Easter Crafts, April 2025"><div class="gallery-img h-md"><img src="images/deploy/2025-easter-crafts-02.webp" alt="Easter Crafts, April 2025" loading="lazy"></div><span class="gallery-caption">Easter Crafts, April 2025</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Creepy Crafts, November 2024"><div class="gallery-img h-lg"><img src="images/deploy/2024-creepy-crafts-01.webp" alt="Creepy Crafts, November 2024" loading="lazy"></div><span class="gallery-caption">Creepy Crafts, November 2024</span></button>
<button class="gallery-item fade-up" data-category="colour-run" type="button" aria-label="View Colour Run, July 2024"><div class="gallery-img h-sm"><img src="images/deploy/2024-colour-run-06.webp" alt="Colour Run, July 2024" loading="lazy"></div><span class="gallery-caption">Colour Run, July 2024</span></button>
<button class="gallery-item fade-up" data-category="colour-run" type="button" aria-label="View Colour Run, August 2023"><div class="gallery-img h-md"><img src="images/deploy/2023-colour-run-06.webp" alt="Colour Run, August 2023" loading="lazy"></div><span class="gallery-caption">Colour Run, August 2023</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Half-term fun, June 2023"><div class="gallery-img h-lg"><img src="images/deploy/2023-half-term-fun-04.webp" alt="Half-term fun, June 2023" loading="lazy"></div><span class="gallery-caption">Half-term fun, June 2023</span></button>
<button class="gallery-item fade-up" data-category="nature" type="button" aria-label="View Badger Park Tree Festival, October 2022"><div class="gallery-img h-sm"><img src="images/deploy/2022-tree-festival-11.webp" alt="Badger Park Tree Festival, October 2022" loading="lazy"></div><span class="gallery-caption">Badger Park Tree Festival, October 2022</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Jubilee picnic, June 2022"><div class="gallery-img h-md"><img src="images/deploy/2022-jubilee-picnic-07.webp" alt="Jubilee picnic, June 2022" loading="lazy"></div><span class="gallery-caption">Jubilee picnic, June 2022</span></button>
<button class="gallery-item fade-up" data-category="community" type="button" aria-label="View Official opening of the new park, February 2022"><div class="gallery-img h-lg"><img src="images/deploy/2022-park-opening-05.webp" alt="Official opening of the new park, February 2022" loading="lazy"></div><span class="gallery-caption">Official opening of the new park, February 2022</span></button>
<button class="gallery-item fade-up" data-category="nature" type="button" aria-label="View Bulb planting, October 2020"><div class="gallery-img h-sm"><img src="images/deploy/2020-bulb-planting-11.webp" alt="Bulb planting, October 2020" loading="lazy"></div><span class="gallery-caption">Bulb planting, October 2020</span></button>
    </div>

    <div class="upload-cta">
      <div style="font-size:2.5rem;margin-bottom:0.75rem;">📸</div>
      <h3 style="color:var(--blue-dark);margin-bottom:0.5rem;">Got photos to share?</h3>
      <p style="color:var(--text-muted);margin-bottom:1.25rem;max-width:440px;margin-left:auto;margin-right:auto;">We'd love to see your photos from the park! Send them to us and we may feature them in our gallery.</p>
      <a href="contact.html" class="btn btn-primary">Send us your photos</a>
    </div>

  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous photo">‹</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next photo">›</button>
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close photo viewer">✕</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lightboxPhoto" src="" alt="">
    <div class="lightbox-body">
      <h3 id="lightboxTitle">Photo title</h3>
      <p id="lightboxMeta">Location · Date</p>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  // Gallery filter
  document.querySelectorAll('.gallery-filter button').forEach(btn => {
    btn.addEventListener('click', function(){
      document.querySelectorAll('.gallery-filter button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const filter=this.dataset.filter;
      document.querySelectorAll('.gallery-item').forEach(item => { item.hidden=filter!=='all' && item.dataset.category!==filter; });
    });
  });

  // Browse every photo that matches the current gallery filter.
  const galleryItems=Array.from(document.querySelectorAll('.gallery-item'));
  const lightbox=document.getElementById('lightbox');
  let activePhoto=0;
  function visiblePhotos(){return galleryItems.filter(item=>!item.hidden);}
  function showPhoto(item){
    const photos=visiblePhotos(); activePhoto=photos.indexOf(item);
    if(activePhoto<0)return;
    const img=item.querySelector('img');
    document.getElementById('lightboxPhoto').src=img.src;
    document.getElementById('lightboxPhoto').alt=img.alt;
    document.getElementById('lightboxTitle').textContent=img.alt;
    document.getElementById('lightboxMeta').textContent=`Photo ${activePhoto+1} of ${photos.length} · Friends of the Badger Park`;
    lightbox.classList.add('open');
  }
  function stepPhoto(direction){
    const photos=visiblePhotos(); if(!photos.length)return;
    activePhoto=(activePhoto+direction+photos.length)%photos.length;
    showPhoto(photos[activePhoto]);
  }
  galleryItems.forEach(item=>item.addEventListener('click',()=>showPhoto(item)));
  document.getElementById('lightboxPrev').addEventListener('click',()=>stepPhoto(-1));
  document.getElementById('lightboxNext').addEventListener('click',()=>stepPhoto(1));
  function closeLightbox(){lightbox.classList.remove('open');}
  document.getElementById('lightboxClose').addEventListener('click',closeLightbox);
  lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
  document.addEventListener('keydown',e=>{
    if(!lightbox.classList.contains('open'))return;
    if(e.key==='ArrowLeft')stepPhoto(-1);
    else if(e.key==='ArrowRight')stepPhoto(1);
    else if(e.key==='Escape')closeLightbox();
  });
</script>
</body>
</html>
